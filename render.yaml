services:
  - type: web
    name: scamshield-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
databases:
  - name: scamshield-db
    databaseName: scamshield
    user: scamshield
# File scanners deliberately fail closed until SCANNER_WORKER_URL and
# SCANNER_WORKER_KEY are set on the API. Deploy the worker Dockerfile on a
# private, resource-constrained service; do not run it in the API container.
