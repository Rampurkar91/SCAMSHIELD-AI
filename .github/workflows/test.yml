name: Test ScamShield
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scamshield_ci
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: scamshield_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scamshield_ci -d scamshield_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: python -m pytest backend/tests -q
      - name: PostgreSQL migrations and real-database smoke journey
        env:
          DATABASE_URL: postgresql+psycopg://scamshield_ci:ci-only-disposable-password@localhost:5432/scamshield_ci
          JWT_SECRET_KEY: ci-only-signing-key-for-disposable-run-at-least-32-bytes
          APP_ENV: production
          ALLOW_DATABASE_SMOKE_TEST: 'true'
        run: |
          alembic upgrade head
          python -m backend.scripts.smoke_database
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
